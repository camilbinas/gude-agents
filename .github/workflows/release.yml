# Releases every published Gude module together at one version. All mechanics
# live in .github/scripts/release.sh; the module list is .github/modules.txt.
#
# A push to master releases automatically when it holds a feat (minor) or a
# fix, refactor or perf (patch) commit since the last release. Breaking changes
# and everything else wait for a manual run, which names the version and may be
# a dry run.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without "v", for example 1.9.0
        required: true
        type: string
      mode:
        description: dry-run prepares and verifies only; release also commits, tags and publishes
        required: true
        type: choice
        options: [dry-run, release]
        default: dry-run

permissions:
  contents: write

concurrency:
  group: gude-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  choose-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.choose.outputs.version }}
      skip: ${{ steps.choose.outputs.skip }}
    steps:
      # Always the tip of master for pushes: an earlier run may have released
      # since this one was queued.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'master' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: choose
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release.sh choose-version --version "$REQUESTED_VERSION"

  release:
    needs: choose-version
    if: needs.choose-version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.choose-version.outputs.version }}
      MODE: ${{ inputs.mode || 'release' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'master' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 1. Validate release request
        run: bash .github/scripts/release.sh validate --version "$VERSION" --mode "$MODE"

      - name: 2. Test source modules
        run: bash .github/scripts/release.sh test

      - name: 3. Prepare module versions
        run: bash .github/scripts/release.sh prepare --version "$VERSION"

      - name: 4. Seal module checksums
        run: bash .github/scripts/release.sh seal --version "$VERSION"

      - name: 5. Verify prepared release
        run: bash .github/scripts/release.sh verify --version "$VERSION"

      - name: 6. Show dry-run plan
        if: env.MODE == 'dry-run'
        run: bash .github/scripts/release.sh plan --version "$VERSION"

      - name: 7. Commit release metadata
        if: env.MODE == 'release'
        run: bash .github/scripts/release.sh commit --version "$VERSION"

      - name: 8. Create module tags
        if: env.MODE == 'release'
        run: bash .github/scripts/release.sh tags --version "$VERSION"

      - name: 9. Push release atomically
        if: env.MODE == 'release'
        run: bash .github/scripts/release.sh push --version "$VERSION"

      - name: 10. Create GitHub release
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh github-release --version "$VERSION"
