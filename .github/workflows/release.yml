# Releases every published Gude module together at one version. All mechanics
# live in .github/scripts/release.sh; the module list is .github/modules.txt.
#
# A push to master releases automatically when it holds a feat (minor) or a
# fix, refactor or perf (patch) commit since the last release. Breaking changes
# and everything else wait for a manual run, which names the version and may be
# a dry run from any branch. Real releases only come from master.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without "v", for example 1.9.0
        required: true
        type: string
      mode:
        description: dry-run prepares and verifies only; release also commits, tags and publishes
        required: true
        type: choice
        options: [dry-run, release]
        default: dry-run

permissions:
  contents: write

concurrency:
  group: gude-release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # One checkout for the whole run: the version is chosen from it and every
      # stage below works on this same commit. A push to master checks out its
      # tip (an earlier queued run may have released since it was triggered). If
      # master moves after this point, the atomic push in stage 9 is rejected.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'master' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Sets RELEASE_VERSION and RELEASE_MODE (dry-run, release, or skip when a
      # push has nothing to release) for the stages below.
      - name: Choose release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: bash .github/scripts/release.sh choose-version --version "$REQUESTED_VERSION" --mode "$REQUESTED_MODE"

      - name: 1. Validate release request
        if: env.RELEASE_MODE != 'skip'
        run: bash .github/scripts/release.sh validate --version "$RELEASE_VERSION" --mode "$RELEASE_MODE"

      - name: 2. Test source modules
        if: env.RELEASE_MODE != 'skip'
        run: bash .github/scripts/release.sh test

      - name: 3. Prepare module versions
        if: env.RELEASE_MODE != 'skip'
        run: bash .github/scripts/release.sh prepare --version "$RELEASE_VERSION"

      - name: 4. Seal module checksums
        if: env.RELEASE_MODE != 'skip'
        run: bash .github/scripts/release.sh seal --version "$RELEASE_VERSION"

      - name: 5. Verify prepared release
        if: env.RELEASE_MODE != 'skip'
        run: bash .github/scripts/release.sh verify --version "$RELEASE_VERSION"

      - name: 6. Show dry-run plan
        if: env.RELEASE_MODE == 'dry-run'
        run: bash .github/scripts/release.sh plan --version "$RELEASE_VERSION"

      - name: 7. Commit release metadata
        if: env.RELEASE_MODE == 'release'
        run: bash .github/scripts/release.sh commit --version "$RELEASE_VERSION"

      - name: 8. Create module tags
        if: env.RELEASE_MODE == 'release'
        run: bash .github/scripts/release.sh tags --version "$RELEASE_VERSION"

      - name: 9. Push release atomically
        if: env.RELEASE_MODE == 'release'
        run: bash .github/scripts/release.sh push --version "$RELEASE_VERSION"

      - name: 10. Create GitHub release
        if: env.RELEASE_MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh github-release --version "$RELEASE_VERSION"
