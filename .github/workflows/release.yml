# Lockstep release workflow for the multi-module gude-agents repository.
#
# Goal: use go.work to validate all local modules together, then publish every
# published module at one shared version with its intra-repository requirements
# updated to that same version. Examples and integration remain local-only.
#
# Conventional commit prefixes:
#   feat:                    -> minor bump (0.3.0 -> 0.4.0)
#   fix:, refactor:, perf:   -> patch bump (0.3.0 -> 0.3.1)
#   feat! or BREAKING CHANGE -> major bump (0.3.0 -> 1.0.0)
#
# The breaking-change signals are supported for future use, but current pre-v1
# development does not emit them.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate a calculated release without committing, tagging, or publishing it.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ROOT_MODULE: github.com/camilbinas/gude-agents
  UNPUBLISHED_MODULES: '^(examples|integration)$'

jobs:
  release:
    # Release commits do not trigger another push release. Manual runs remain
    # available so operators can validate a release with dry_run enabled.
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # go.work is the local-development overlay: it makes every workspace
      # module resolve to this checkout, independent of the versions recorded
      # in go.mod. The tag/manifest logic below deliberately uses tracked
      # go.mod files instead, since those are the independently published units.
      - name: Discover workspace and published modules
        run: |
          set -euo pipefail

          git ls-files -- 'go.mod' '**/go.mod' \
            | while read -r go_mod; do dirname "$go_mod"; done \
            | sort -u > "$RUNNER_TEMP/all-modules.txt"

          grep -vxE "$UNPUBLISHED_MODULES" "$RUNNER_TEMP/all-modules.txt" \
            > "$RUNNER_TEMP/published-modules.txt"

          go work edit -json \
            | jq -r '.Use[]?.DiskPath' \
            | sed -e 's|^\./||' -e 's|/$||' \
            | sort -u > "$RUNNER_TEMP/workspace-modules.txt"

          missing=$(comm -23 "$RUNNER_TEMP/all-modules.txt" "$RUNNER_TEMP/workspace-modules.txt")
          if [ -n "$missing" ]; then
            echo "::error::Tracked modules missing from go.work:"
            printf '%s\n' "$missing"
            exit 1
          fi

          while read -r module_dir; do
            (cd "$module_dir" && go mod edit -json | jq -r '.Module.Path')
          done < "$RUNNER_TEMP/published-modules.txt" \
            | sort -u > "$RUNNER_TEMP/published-module-paths.txt"

          echo "Workspace modules: $(wc -l < "$RUNNER_TEMP/all-modules.txt")"
          echo "Published modules: $(wc -l < "$RUNNER_TEMP/published-modules.txt")"

      # Conventional commits determine the shared release version. feat! and
      # BREAKING CHANGE are supported for future major releases, even though
      # current pre-v1 development does not emit those markers.
      - name: Determine shared version
        id: version
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1 || true)
          if [ -z "$latest_tag" ]; then
            latest_tag=v0.0.0
            commit_range=HEAD
          else
            commit_range="${latest_tag}..HEAD"
          fi

          bump=none
          while IFS= read -r -d '' message; do
            [ -n "${message//[[:space:]]/}" ] || continue
            subject=${message%%$'\n'*}

            if printf '%s' "$subject" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
              || printf '%s\n' "$message" | grep -qE '^BREAKING[ -]CHANGE:'; then
              bump=major
              break
            elif printf '%s' "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              bump=minor
            elif [ "$bump" = none ] && printf '%s' "$subject" | grep -qE '^(fix|refactor|perf)(\([^)]*\))?:'; then
              bump=patch
            fi
          done < <(git log -z --format=%B "$commit_range"; printf '\0')

          if [ "$bump" = none ]; then
            echo "No releasable conventional commits since $latest_tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=${latest_tag#v}
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          patch=${rest#*.}

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_version="v${major}.${minor}.${patch}"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Releasing $new_version from $latest_tag ($bump)."

      # A version is immutable. A partial historical release is never repaired
      # automatically: any occupied root or module tag blocks this run.
      - name: Check target tags are unused
        if: steps.version.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          while read -r module_dir; do
            if [ "$module_dir" = . ]; then
              echo "$NEW_VERSION"
            else
              echo "${module_dir}/${NEW_VERSION}"
            fi
          done < "$RUNNER_TEMP/published-modules.txt" > "$RUNNER_TEMP/tags.txt"

          clashes=()
          while read -r tag; do
            if git show-ref --verify --quiet "refs/tags/$tag" \
              || git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" >/dev/null 2>&1; then
              clashes+=("$tag")
            fi
          done < "$RUNNER_TEMP/tags.txt"

          if [ "${#clashes[@]}" -gt 0 ]; then
            echo "::error::Refusing to publish an occupied or partial version:"
            printf '  %s\n' "${clashes[@]}"
            exit 1
          fi

      # Validate local source using the workspace before release metadata is
      # changed. Unpublished examples/integration are compiled and vetted, but
      # their test binaries are not executed in the release job.
      - name: Verify workspace modules
        if: steps.version.outputs.skip == 'false'
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          workspace="$PWD/go.work"
          failed=()

          while read -r module_dir; do
            echo "::group::verify $module_dir"
            ok=true
            (cd "$module_dir" && GOWORK="$workspace" go build ./...) || ok=false
            (cd "$module_dir" && GOWORK="$workspace" go vet ./...) || ok=false

            case "$module_dir" in
              examples|integration)
                (cd "$module_dir" && GOWORK="$workspace" go test -run '^$' ./...) || ok=false
                ;;
              *)
                (cd "$module_dir" && GOWORK="$workspace" go test ./...) || ok=false
                ;;
            esac

            echo "::endgroup::"
            if [ "$ok" != true ]; then
              failed+=("$module_dir")
            fi
          done < "$RUNNER_TEMP/all-modules.txt"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Module verification failed: ${failed[*]}"
            exit 1
          fi

      # Only existing edges between published modules are rewritten. The root
      # module is in published-modules.txt, so its logging-module requirements
      # are updated too. Internal local replace directives are removed because
      # consumers ignore replacements declared by dependency modules.
      - name: Rewrite and verify internal module requirements
        if: steps.version.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          while read -r module_dir; do
            mapfile -t requirements < <(
              (cd "$module_dir" && go mod edit -json | jq -r '.Require[]?.Path')
            )
            mapfile -t replacements < <(
              (cd "$module_dir" && go mod edit -json \
                | jq -r '.Replace[]? | [.Old.Path, (.Old.Version // "")] | @tsv')
            )

            args=()
            while read -r internal_path; do
              if printf '%s\n' "${requirements[@]}" | grep -qxF "$internal_path"; then
                args+=("-require=${internal_path}@${NEW_VERSION}")
              fi
            done < "$RUNNER_TEMP/published-module-paths.txt"

            for replacement in "${replacements[@]}"; do
              old_path=${replacement%%$'\t'*}
              old_version=${replacement#*$'\t'}
              if grep -qxF "$old_path" "$RUNNER_TEMP/published-module-paths.txt"; then
                key=$old_path
                if [ -n "$old_version" ]; then key="${key}@${old_version}"; fi
                args+=("-dropreplace=${key}")
              fi
            done

            if [ "${#args[@]}" -gt 0 ]; then
              (cd "$module_dir" && go mod edit "${args[@]}")
            fi
          done < "$RUNNER_TEMP/published-modules.txt"

          errors=()
          while read -r module_dir; do
            module_json=$(cd "$module_dir" && go mod edit -json)

            while read -r internal_path; do
              required_version=$(jq -r --arg path "$internal_path" \
                '.Require[]? | select(.Path == $path) | .Version' <<< "$module_json")
              if [ -n "$required_version" ] && [ "$required_version" != "$NEW_VERSION" ]; then
                errors+=("$module_dir requires $internal_path@$required_version, expected $NEW_VERSION")
              fi
            done < "$RUNNER_TEMP/published-module-paths.txt"

            retained_replace=$(jq -r --arg root "$ROOT_MODULE" \
              '.Replace[]?.Old.Path | select(. == $root or startswith($root + "/"))' <<< "$module_json")
            if [ -n "$retained_replace" ]; then
              errors+=("$module_dir retains internal replace(s): $retained_replace")
            fi
          done < "$RUNNER_TEMP/published-modules.txt"

          if [ "${#errors[@]}" -gt 0 ]; then
            echo "::error::Release metadata invariant failed:"
            printf '  %s\n' "${errors[@]}"
            exit 1
          fi

          unexpected=$(git diff --name-only | grep -vE '(^|/)go\.mod$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Version rewrite changed files other than go.mod:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      # A manual dry run exercises the same discovery, verification, and
      # metadata-rewrite path as a publish, but deliberately leaves no commit,
      # tags, or GitHub Release behind.
      - name: Report dry run
        if: steps.version.outputs.skip == 'false' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: echo "Dry run completed for ${NEW_VERSION}; no release was published."

      - name: Commit, tag, and push atomically
        if: steps.version.outputs.skip == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while read -r module_dir; do
            if [ "$module_dir" = . ]; then
              git add go.mod
            else
              git add "$module_dir/go.mod"
            fi
          done < "$RUNNER_TEMP/published-modules.txt"

          git diff --cached --quiet || git commit -m "chore: release ${NEW_VERSION}"

          refs=(HEAD:master)
          while read -r tag; do
            git tag "$tag"
            refs+=("refs/tags/${tag}:refs/tags/${tag}")
          done < "$RUNNER_TEMP/tags.txt"

          git push --atomic origin "${refs[@]}"

      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --generate-notes \
            --notes-start-tag "$LATEST_TAG"
