# Releases every published Gude module together at one version. All mechanics
# live in .github/scripts/release.sh; the module list is .github/modules.txt.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without "v", for example 1.9.0
        required: true
        type: string
      mode:
        description: dry-run prepares and verifies only; release also commits, tags and publishes
        required: true
        type: choice
        options: [dry-run, release]
        default: dry-run

permissions:
  contents: write

concurrency:
  group: gude-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  MODE: ${{ inputs.mode }}
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 1. Validate release request
        run: bash .github/scripts/release.sh validate --version "$VERSION" --mode "$MODE"

      - name: 2. Test source modules
        run: bash .github/scripts/release.sh test

      - name: 3. Prepare module versions
        run: bash .github/scripts/release.sh prepare --version "$VERSION"

      - name: 4. Seal module checksums
        run: bash .github/scripts/release.sh seal --version "$VERSION"

      - name: 5. Verify prepared release
        run: bash .github/scripts/release.sh verify --version "$VERSION"

      - name: 6. Show dry-run plan
        if: inputs.mode == 'dry-run'
        run: bash .github/scripts/release.sh plan --version "$VERSION"

      - name: 7. Commit release metadata
        if: inputs.mode == 'release'
        run: bash .github/scripts/release.sh commit --version "$VERSION"

      - name: 8. Create module tags
        if: inputs.mode == 'release'
        run: bash .github/scripts/release.sh tags --version "$VERSION"

      - name: 9. Push release atomically
        if: inputs.mode == 'release'
        run: bash .github/scripts/release.sh push --version "$VERSION"

      - name: 10. Create GitHub release
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
