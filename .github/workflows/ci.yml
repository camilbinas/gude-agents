# The same module checks the release runs before it prepares anything, plus the
# race, vulnerability and lint lanes that gate a pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Pin the toolchain CI builds and tests with. govulncheck flagged stdlib
  # issues in go1.27.2; 1.27.4 is the latest 1.27 patch and carries the fixes.
  # The modules keep their own `go 1.26.0` directive; this only sets what CI runs.
  GO_VERSION: "1.27.4"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # Modules are discovered from git; a new one must have a module path that
      # matches its directory, or its release tag could not work.
      - name: Check discovered modules
        run: bash .github/scripts/release.sh modules
      - name: Test release scripts
        run: bash .github/scripts/release-test.sh
      - name: Test modules
        run: bash .github/scripts/release.sh test

  race:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # Run the concurrency-sensitive modules (root, provider/*, conversation/*,
      # execution and execution/*, ratelimit/* and tool/*) under -race.
      - name: Race-detector tests
        run: bash .github/scripts/release.sh race

  vuln:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Vulnerability scan
        run: bash .github/scripts/release.sh vuln

  lint:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # golangci-lint must be built by the active toolchain, or it panics on
      # newer std-library ASTs; install it from source rather than a prebuilt
      # binary so it matches GO_VERSION.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        run: bash .github/scripts/release.sh lint
