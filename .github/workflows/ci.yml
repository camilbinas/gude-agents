# The same module checks the release runs before it prepares anything.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test modules
        env:
          GOTOOLCHAIN: local
        run: bash .github/scripts/release.sh test
