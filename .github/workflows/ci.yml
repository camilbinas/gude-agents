# The same module checks the release runs before it prepares anything.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Modules are discovered from git; a new one must have a module path that
      # matches its directory, or its release tag could not work.
      - name: Check discovered modules
        run: bash .github/scripts/release.sh modules
      - name: Test release scripts
        run: bash .github/scripts/release-test.sh
      - name: Test modules
        run: bash .github/scripts/release.sh test
